name: Roblox assets and publishing

# Uploads new or changed Roblox assets (roblox/assets.json) with Open Cloud and commits their ids into
# roblox/src/shared/Assets.luau, so Live Sync brings them into Studio. Run it by hand with "publish" ticked to
# publish the Rojo-built place to your experience.
# Needs the repository secret ROBLOX_API_KEY and the variable ROBLOX_USER_ID (see roblox/SETUP.md);
# publishing also needs the variables ROBLOX_UNIVERSE_ID and ROBLOX_PLACE_ID.

on:
  push:
    paths:
      - "roblox/assets.json"
      - "roblox/sounds/**"
      - "roblox/images/**"
      - "roblox/models/godot/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the place to Roblox (replaces the published version)"
        type: boolean
        default: false
      description:
        description: "Put roblox/publish/description.txt on the game page (publishing does this too)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: roblox-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      # (a user id isn't secret: the default is Timber's owner, from the API key)
      ROBLOX_USER_ID: ${{ vars.ROBLOX_USER_ID || secrets.ROBLOX_USER_ID || '1199254307' }}
      # a run started by hand fails loudly when the key is missing; asset pushes just skip
      REQUIRE_KEY: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload new or changed assets
        run: python3 tools/roblox_assets.py

      - name: Commit the new asset ids
        run: |
          if [ -z "$(git status --porcelain roblox/assets.lock.json roblox/src/shared/Assets.luau)" ]; then
            echo "No new asset ids."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roblox/assets.lock.json roblox/src/shared/Assets.luau
          git commit -m "Roblox: new asset ids from the upload"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

      - name: Check what Roblox made of the uploaded models
        continue-on-error: true
        run: |
          python3 tools/inspect_roblox_assets.py
          mkdir -p luau
          wget -q https://github.com/lune-org/lune/releases/download/v0.10.4/lune-0.10.4-linux-x86_64.zip -O luau/lune.zip
          unzip -q -o luau/lune.zip -d luau
          ./luau/lune run roblox/tests/lune/inspect.luau || true

      - name: Publish the place
        if: ${{ inputs.publish }}
        env:
          UNIVERSE: ${{ vars.ROBLOX_UNIVERSE_ID }}
          PLACE: ${{ vars.ROBLOX_PLACE_ID }}
        run: |
          if [ -z "$UNIVERSE" ] || [ -z "$PLACE" ] || [ -z "$ROBLOX_API_KEY" ]; then
            echo "Set ROBLOX_API_KEY, ROBLOX_UNIVERSE_ID and ROBLOX_PLACE_ID first (roblox/SETUP.md)."
            exit 1
          fi
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          mkdir -p luau
          wget -q https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -O luau/rojo.zip
          unzip -q -o luau/rojo.zip -d luau
          (cd roblox && ../luau/rojo build -o ../Timber.rbxl .)
          curl --fail-with-body -sS -X POST \
            "https://apis.roblox.com/universes/v1/$UNIVERSE/places/$PLACE/versions?versionType=Published" \
            -H "x-api-key: $ROBLOX_API_KEY" -H "Content-Type: application/octet-stream" \
            --data-binary @Timber.rbxl

      - name: Put the description on the game page
        if: ${{ inputs.publish || inputs.description }}
        # (only a warning when it rides along with a publish: the place is published either way)
        continue-on-error: ${{ !inputs.description }}
        env:
          UNIVERSE: ${{ vars.ROBLOX_UNIVERSE_ID }}
          PLACE: ${{ vars.ROBLOX_PLACE_ID }}
        run: |
          # Open Cloud's Place resource (the game page shows the start place's description). The API key needs
          # the universe.place:write scope; without it this step says so and the publish above still stands.
          python3 -c 'import json,sys; t=open("roblox/publish/description.txt").read().strip(); assert len(t) <= 1000, len(t); json.dump({"description": t}, open("desc.json","w"))'
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH \
            "https://apis.roblox.com/cloud/v2/universes/$UNIVERSE/places/$PLACE?updateMask=description" \
            -H "x-api-key: $ROBLOX_API_KEY" -H "Content-Type: application/json" --data-binary @desc.json)
          echo "Roblox answered $code"
          if [ "$code" != "200" ]; then
            head -c 600 resp.json; echo
            echo "::warning::The description wasn't updated (HTTP $code). If it's 401/403, add the universe.place:write scope (for this experience) to the API key on the Creator Dashboard, or paste roblox/publish/description.txt by hand."
            exit 1
          fi
