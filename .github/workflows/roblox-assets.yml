name: Roblox assets and publishing

# Uploads new or changed Roblox assets (roblox/assets.json) with Open Cloud and commits their ids into
# roblox/src/shared/Assets.luau, so Live Sync brings them into Studio. Run it by hand with "publish" ticked to
# publish the Rojo-built place to your experience.
# Needs the repository secret ROBLOX_API_KEY and the variable ROBLOX_USER_ID (see roblox/SETUP.md);
# publishing also needs the variables ROBLOX_UNIVERSE_ID and ROBLOX_PLACE_ID.

on:
  push:
    paths:
      - "roblox/assets.json"
      - "roblox/sounds/**"
      - "roblox/images/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the place to Roblox (replaces the published version)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: roblox-assets
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
      # (a user id isn't secret: the default is Timber's owner, from the API key)
      ROBLOX_USER_ID: ${{ vars.ROBLOX_USER_ID || secrets.ROBLOX_USER_ID || '1199254307' }}
      # a run started by hand fails loudly when the key is missing; asset pushes just skip
      REQUIRE_KEY: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Is the key there? (says set or missing for likely names, never shows a value)
        env:
          S_ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY != '' && 'set' || '' }}
          V_ROBLOX_API_KEY: ${{ vars.ROBLOX_API_KEY != '' && 'set' || '' }}
          S_ROBLOX_KEY: ${{ secrets.ROBLOX_KEY != '' && 'set' || '' }}
          V_ROBLOX_KEY: ${{ vars.ROBLOX_KEY != '' && 'set' || '' }}
          S_ROBLOX_APIKEY: ${{ secrets.ROBLOX_APIKEY != '' && 'set' || '' }}
          V_ROBLOX_APIKEY: ${{ vars.ROBLOX_APIKEY != '' && 'set' || '' }}
          S_ROBLOX_API: ${{ secrets.ROBLOX_API != '' && 'set' || '' }}
          V_ROBLOX_API: ${{ vars.ROBLOX_API != '' && 'set' || '' }}
          S_ROBLOX_OPEN_CLOUD_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_KEY != '' && 'set' || '' }}
          V_ROBLOX_OPEN_CLOUD_KEY: ${{ vars.ROBLOX_OPEN_CLOUD_KEY != '' && 'set' || '' }}
          S_OPEN_CLOUD_KEY: ${{ secrets.OPEN_CLOUD_KEY != '' && 'set' || '' }}
          V_OPEN_CLOUD_KEY: ${{ vars.OPEN_CLOUD_KEY != '' && 'set' || '' }}
          S_OPENCLOUD_KEY: ${{ secrets.OPENCLOUD_KEY != '' && 'set' || '' }}
          V_OPENCLOUD_KEY: ${{ vars.OPENCLOUD_KEY != '' && 'set' || '' }}
          S_RBX_API_KEY: ${{ secrets.RBX_API_KEY != '' && 'set' || '' }}
          V_RBX_API_KEY: ${{ vars.RBX_API_KEY != '' && 'set' || '' }}
          S_ROBLOX_TOKEN: ${{ secrets.ROBLOX_TOKEN != '' && 'set' || '' }}
          V_ROBLOX_TOKEN: ${{ vars.ROBLOX_TOKEN != '' && 'set' || '' }}
          S_API_KEY: ${{ secrets.API_KEY != '' && 'set' || '' }}
          V_API_KEY: ${{ vars.API_KEY != '' && 'set' || '' }}
          S_APIKEY: ${{ secrets.APIKEY != '' && 'set' || '' }}
          V_APIKEY: ${{ vars.APIKEY != '' && 'set' || '' }}
          S_KEY: ${{ secrets.KEY != '' && 'set' || '' }}
          V_KEY: ${{ vars.KEY != '' && 'set' || '' }}
        run: |
          env | grep -E '^(S|V)_' | sort | sed -e 's/^S_/secret  /' -e 's/^V_/variable /' -e 's/=set$/: set/' -e 's/=$/: missing/'

      - name: Upload new or changed assets
        run: python3 tools/roblox_assets.py

      - name: Commit the new asset ids
        run: |
          if [ -z "$(git status --porcelain roblox/assets.lock.json roblox/src/shared/Assets.luau)" ]; then
            echo "No new asset ids."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roblox/assets.lock.json roblox/src/shared/Assets.luau
          git commit -m "Roblox: new asset ids from the upload"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          exit 1

      - name: Publish the place
        if: ${{ inputs.publish }}
        env:
          UNIVERSE: ${{ vars.ROBLOX_UNIVERSE_ID }}
          PLACE: ${{ vars.ROBLOX_PLACE_ID }}
        run: |
          if [ -z "$UNIVERSE" ] || [ -z "$PLACE" ] || [ -z "$ROBLOX_API_KEY" ]; then
            echo "Set ROBLOX_API_KEY, ROBLOX_UNIVERSE_ID and ROBLOX_PLACE_ID first (roblox/SETUP.md)."
            exit 1
          fi
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          mkdir -p luau
          wget -q https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -O luau/rojo.zip
          unzip -q -o luau/rojo.zip -d luau
          (cd roblox && ../luau/rojo build -o ../Timber.rbxl .)
          curl --fail-with-body -sS -X POST \
            "https://apis.roblox.com/universes/v1/$UNIVERSE/places/$PLACE/versions?versionType=Published" \
            -H "x-api-key: $ROBLOX_API_KEY" -H "Content-Type: application/octet-stream" \
            --data-binary @Timber.rbxl
