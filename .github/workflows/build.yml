name: Test & build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1
  GODOT_BIN: ./godot/Godot_v4.4.1-stable_linux.x86_64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-win-linux

      - name: Download Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot/godot.zip
          unzip -q godot/godot.zip -d godot && rm godot/godot.zip
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -qj templates.tpz templates/version.txt templates/web_nothreads_release.zip templates/windows_release_x86_64.exe templates/linux_release.x86_64 -d "$T"
          rm templates.tpz

      - name: Import project
        run: ${GODOT_BIN} --headless --import --path . || true

      - name: Gameplay test (chopping, damage, carrying, fainting)
        run: |
          ${GODOT_BIN} --headless --path . res://tests/ChopTest.tscn --fixed-fps 60 2>&1 | tee chop.log
          grep -q "CHOP RESULT: PASS" chop.log

      - name: Gameplay test (tools, shipping truck, shop, delivery boxes)
        run: |
          ${GODOT_BIN} --headless --path . res://tests/LoopTest.tscn --fixed-fps 60 2>&1 | tee loop.log
          grep -q "LOOP RESULT: PASS" loop.log

      - name: Gameplay test (saw, logs, shears, vacuum, hammer builds)
        run: |
          ${GODOT_BIN} --headless --path . res://tests/BuildTest.tscn --fixed-fps 60 2>&1 | tee build.log
          grep -q "BUILD RESULT: PASS" build.log

      - name: Gameplay test (axe variety)
        run: |
          ${GODOT_BIN} --headless --path . res://tests/AxeTest.tscn --fixed-fps 60 2>&1 | tee axe.log
          grep -q "AXE RESULT: PASS" axe.log

      - name: Save test (builds survive a restart)
        run: |
          ${GODOT_BIN} --headless --path . res://tests/SaveTest.tscn --fixed-fps 60 2>&1 | tee save.log
          grep -q "SAVE RESULT: PASS" save.log

      - name: Gameplay test (robo-axe, saws, drills, vacuums)
        run: |
          ${GODOT_BIN} --headless --path . res://tests/GearTest.tscn --fixed-fps 60 2>&1 | tee gear.log
          grep -q "GEAR RESULT: PASS" gear.log

      - name: Export Web, Windows and Linux
        run: |
          mkdir -p build/web build/windows build/linux
          ${GODOT_BIN} --headless --path . --export-release "Web" build/web/index.html
          ${GODOT_BIN} --headless --path . --export-release "Windows" build/windows/Timber.exe
          ${GODOT_BIN} --headless --path . --export-release "Linux" build/linux/Timber.x86_64
          ls -la build/*

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: Timber-web
          path: build/web

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Timber-windows
          path: build/windows

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: Timber-linux
          path: build/linux

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    # Publishes the browser build to GitHub Pages (enable Pages with "GitHub Actions" as the source).
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Stays green until Pages is enabled for the repository (Settings -> Pages -> Source: GitHub Actions).
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
